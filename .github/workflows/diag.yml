name: diag
on: { push: { branches: [claude/project-thread-i8evdz] } }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          o=diag-out.txt; rm -f $o
          t() { curl -s -o /dev/null -D h.txt -w "%{http_code} %{time_starttransfer}" -A "${2:-$UA}" "$1"; echo " $(grep -i '^cf-ray' h.txt | tr -d '\r' | awk '{print $2}' | cut -d- -f2) $1"; }
          for s in suwon taean podo-cc seonunsan maisan sokcho; do
            t "https://tripnalc.com/weather/$s?d=$RANDOM$RANDOM" >> $o
            t "https://tripnalc.com/weather/$s?d=$RANDOM$RANDOM" >> $o
            t "https://tripnalc.com/weather/$s?d=$RANDOM$RANDOM" "Mozilla/5.0 Chrome/120" >> $o
          done
          t "https://tripnalc.com/api/forecast?lat=37.27&lon=127.01&z=$RANDOM" >> $o
          t "https://tripnalc.com/api/forecast?lat=37.27&lon=127.01&z=$RANDOM" >> $o
          t "https://tripnalc.com/api/warnings?z=$RANDOM" >> $o
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add $o; git commit -m "diag output"; git push
