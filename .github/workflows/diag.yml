name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            curl -s -m 60 -o k.html 'https://data.kma.go.kr/tmeta/stn/selectStnList.do?pgmNo=123'
            wc -c k.html
            grep -n -i 'ajax\|url\s*:\|\.do' k.html | grep -v 'css\|href="/' | head -40
            grep -n '대관령' k.html | head -5
            grep -n -A3 '37\.67\|128\.71' k.html | head -20
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
