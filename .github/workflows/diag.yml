name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, concurrent.futures as cf
          k = urllib.parse.quote(os.environ["KHOA_API_KEY"], safe="")
          def one(i):
              u = f"https://apis.data.go.kr/1360000/AsosHourlyInfoService/getWthrDataList?serviceKey={k}&pageNo=1&numOfRows=1&dataType=JSON&dataCd=ASOS&dateCd=HR&startDt=20261020&startHh=00&endDt=20261020&endHh=00&stnIds={i}"
              try:
                  d = json.load(urllib.request.urlopen(u, timeout=30))
                  it = d["response"]["body"]["items"]["item"][0]
                  return f'{i},{it["stnNm"]},{it["ta"]}'
              except Exception as e:
                  return None
          with cf.ThreadPoolExecutor(8) as ex:
              for r in ex.map(one, range(90, 300)):
                  if r: print(r)
          PY
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
