name: diag
on: { push: { branches: [claude/project-thread-i8evdz] } }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'diag output')"
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          {
          for ua in "$UA" "Mozilla/5.0 Chrome/130"; do
            curl -s -A "$ua" "https://tripnalc.com/?v=$RANDOM" > h.html
            echo "== $ua size=$(wc -c < h.html)"; grep -o '<title>[^<]*</title>' h.html | head -2; grep -oi '<link[^>]*canonical[^>]*>' h.html | head; grep -o '<meta name="description"[^>]*>' h.html | head -1
            grep -o 'hrefLang="[^"]*"' h.html | head -3
          done
          } > diag-out.txt 2>&1
          git config user.name bot; git config user.email bot@x; git add diag-out.txt; git commit -m "diag output"; git push
