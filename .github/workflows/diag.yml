name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            G=$(python3 -c "import urllib.parse;print(urllib.parse.quote('동남아시아'))")
            for u in "/overseas/month/10" "/overseas/month/10?m=9,10,11&s=shoulder&g=$G" "/overseas/month/8?s=off" "/overseas/bangkok" "/"; do
              f=$(echo "$u" | md5sum | cut -c1-8).html
              echo "$u $(curl -s -o $f -w '%{http_code} %{time_total} %{size_download}' "https://tripnalc.com$u")"
              grep -o '<h1[^>]*>[^<]*' $f | head -1; grep -c 'tf-card' $f; grep -o 'mc-sh' $f | head -1
            done
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
