name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            for u in "/overseas" "/overseas/month/3" "/weather" "/"; do
              f=$(echo "$u" | md5sum | cut -c1-8).html
              echo "$u $(curl -s -o $f -w '%{http_code} %{size_download}' "https://tripnalc.com$u")"
              grep -o '<h1[^>]*>[^<]*' $f | head -1; grep -o 'ov-search' $f | head -1; grep -o '3초 만에 골라보기' $f | head -1; grep -o '해외날씨·여행지' $f | head -1
            done
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
