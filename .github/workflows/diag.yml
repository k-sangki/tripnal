name: diag
on: { push: { branches: [claude/project-thread-i8evdz] } }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'diag output')"
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          {
          for u in /weekend /autumn-foliage /weather/seoul /; do
            curl -s -A "$UA" "https://tripnalc.com$u" > p.html
            echo "$u query-links=$(grep -oE '<a [^>]*href="[^"]*\?(from|act|vd)=[^"]*"[^>]*>' p.html | wc -l) nofollow=$(grep -oE '<a [^>]*href="[^"]*\?(from|act|vd)=[^"]*"[^>]*>' p.html | grep -c nofollow)"
          done
          } > diag-out.txt 2>&1
          git config user.name bot; git config user.email bot@x; git add diag-out.txt; git commit -m "diag output"; git push
