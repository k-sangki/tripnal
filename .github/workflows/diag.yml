name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            u="/weather/jarasum-autocamp"
            echo "$u $(curl -s -o p.html -w '%{http_code}' "https://tripnalc.com$u")"
            for c in $(grep -o '/_next/static/chunks/[^"]*\.js' p.html | sort -u); do curl -s "https://tripnalc.com$c" >> all.js; done
            grep -o '유럽 중기 기상예보 센터' all.js | head -1; grep -o 'cf-src-sub' all.js | head -1; grep -o '독일기상청 DWD' all.js | head -1
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
