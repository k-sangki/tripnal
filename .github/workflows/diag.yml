name: diag
on: { push: { branches: [claude/project-thread-i8evdz] } }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'diag output')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python collector/mountain_climate.py .github/diag/mountains.json > diag-out.txt 2>&1 || true
          git config user.name bot; git config user.email bot@x; git add diag-out.txt; git add src/data/mountain-climate.json || true; git commit -m "diag output"; git push
