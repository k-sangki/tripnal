name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
          for u in /overseas /overseas/tokyo /overseas/paris /overseas/honolulu /overseas/fukuoka "/api/og?slug=paris"; do curl -s -o p.out -w "$u %{http_code} %{content_type} " "https://tripnalc.com$u"; grep -ao '<title>[^<]*' p.out | head -1; echo; done
          curl -s https://tripnalc.com/ | grep -o "해외 날씨" | head -1
          curl -s https://tripnalc.com/sitemap.xml | grep -c "<loc>"
          python3 - <<'PY'
          import json, urllib.request
          d = json.load(open("src/data/overseas.json"))
          bad = []
          for x in d:
              try:
                  f = json.load(urllib.request.urlopen(urllib.request.Request(f"https://tripnalc.com/api/forecast?lat={x['lat']}&lon={x['lon']}&v=6&t=1", headers={"User-Agent":"diag"}), timeout=60))
                  a = f["days"][0]; b = f["days"][-1]
                  print(x["slug"], f.get("utcOffset"), f["source"], len(f["days"]), a["date"], a["tMin"], a["tMax"], a["sunrise"], a["precipProbMax"], "| last", b["date"], b["tMax"])
              except Exception as e:
                  bad.append((x["slug"], str(e)))
          print("bad", bad)
          PY
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
