name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            curl -s -m 60 -o isd.csv https://www.ncei.noaa.gov/pub/data/noaa/isd-history.csv
            grep '"KS"' isd.csv | grep '^"47[12]' | cut -d, -f1,3,7,8,9,11 > ks.txt
            cat ks.txt
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
