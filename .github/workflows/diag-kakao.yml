name: diag-kakao
on: push
jobs:
  diag:
    if: github.ref == 'refs/heads/claude/project-thread-x7f4ry'
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install chromium >/dev/null
          cat > t.js <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 390, height: 844 }, locale: "ko-KR" });
            p.on("console", (m) => console.log("console", m.type(), m.text()));
            p.on("pageerror", (e) => console.log("pageerror", e.message));
            p.on("requestfailed", (r) => console.log("reqfail", r.url(), r.failure()?.errorText));
            p.on("response", (r) => { if (/kakao/.test(r.url())) console.log("resp", r.status(), r.url().slice(0, 120)); });
            await p.goto("https://tripnalc.com/weather/seoul?me=1", { waitUntil: "networkidle" });
            await p.click("button.fab");
            await p.waitForTimeout(8000);
            console.log("buttons", await p.$$eval(".share-grid button", (bs) => bs.map((x) => x.textContent)));
            console.log("Kakao", await p.evaluate(() => ({ has: !!window.Kakao, share: !!window.Kakao?.Share, init: window.Kakao?.isInitialized?.(), scripts: [...document.scripts].map((s) => s.src).filter((s) => /kakao/.test(s)) })));
            await b.close();
          })();
          JS
          node t.js
