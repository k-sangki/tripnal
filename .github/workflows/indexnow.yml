name: IndexNow

# 사이트맵 주소 전체를 IndexNow(Bing·네이버 등)에 알린다. 매주 월요일 + 필요할 때 손으로.
on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector/indexnow.py
