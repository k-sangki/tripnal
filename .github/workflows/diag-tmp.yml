name: Diag (temporary)
on:
  push:
    branches: [claude/project-thread-cmner1]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MISS/HIT timings
        run: |
          T=$RANDOM$RANDOM
          for p in /tide /weather/seoul /golf/gangwon /golf/gyeonggi /weather/jirisan-cheonwangbong /; do
            for i in 1 2 3; do T=$RANDOM;
              curl -s -o /dev/null -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" -D /tmp/h -w "$p try$i %{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}" "https://tripnalc.com$p?_d=$T"
              echo " $(grep -i '^x-edge-cache' /tmp/h | tr -d '\r') $(grep -i '^cf-ray' /tmp/h | tr -d '\r')"
            done
          done
      - name: Workers status counts (7d)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          S=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ); E=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          Q='{"query":"query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:100,filter:{datetime_geq:$s,datetime_leq:$e},orderBy:[sum_requests_DESC]){sum{requests errors subrequests} quantiles{cpuTimeP50 cpuTimeP99 wallTimeP50 wallTimeP99} dimensions{scriptName status date}}}}}","variables":{"a":"'$CLOUDFLARE_ACCOUNT_ID'","s":"'$S'","e":"'$E'"}}'
          curl -s https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -d "$Q" | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          if d.get('errors'): print(d['errors']); sys.exit()
          for r in d['data']['viewer']['accounts'][0]['workersInvocationsAdaptive']:
              print(r['dimensions'], r['sum'], r['quantiles'])
          "
      - name: Workers Logs exceptions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NOW=$(date +%s%3N); FROM=$((NOW-3*86400000))
          for body in \
            '{"queryId":"diag","timeframe":{"from":'$FROM',"to":'$NOW'},"view":"events","limit":50,"parameters":{"filters":[{"key":"$metadata.outcome","operation":"eq","type":"string","value":"exception"}]}}' \
            '{"queryId":"diag2","timeframe":{"from":'$FROM',"to":'$NOW'},"view":"events","limit":50,"parameters":{"filters":[{"key":"$metadata.level","operation":"eq","type":"string","value":"error"}]}}'; do
            curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -d "$body" > /tmp/o.json
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/o.json'))
          if not d.get('success'): print(json.dumps(d)[:1500]); raise SystemExit
          ev=(d.get('result') or {}).get('events',{}).get('events',[])
          print('events',len(ev))
          for e in ev[:50]:
              m=e.get('$metadata',{}); w=e.get('$workers',{})
              req=(w.get('event') or {}).get('request') or {}
              print(m.get('service'), e.get('timestamp'), w.get('outcome'), req.get('url'), (req.get('headers') or {}).get('user-agent','')[:40], '|', str(m.get('error') or m.get('message'))[:200])
          PY
          done
