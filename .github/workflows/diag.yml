name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            git fetch -q origin main && git checkout origin/main -- collector src/lib/places.ts
            pip install -q boto3
            python collector/weekend.py
            for u in / /weekend /overseas /overseas/month/10 /overseas/tokyo /weather; do
              echo "$u $(curl -s -o /tmp/p.html -w '%{http_code} %{time_total}' https://tripnalc.com$u)"
            done
            curl -s https://tripnalc.com/weekend | grep -o '주말 캠핑 가기 좋은 곳\|정리하는 중\|wk-rank">[0-9]*' | head -5
            curl -s https://tripnalc.com/overseas/tokyo | grep -o '한국과 시차 없음\|엔(JPY)\|비행 약 [0-9]*시간' | head
            curl -s https://tripnalc.com/sitemap.xml | grep -c overseas/month
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
