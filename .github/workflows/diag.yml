name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
          python3 - <<'PY'
          import os, urllib.request, urllib.parse
          key=os.environ["KHOA_API_KEY"]
          base="https://apis.data.go.kr/1360000/WthrWrnInfoService/"
          for op, extra in [("getPwnStatus",{}),("getWthrWrnList",{"stnId":"108"}),("getWthrWrnMsg",{"stnId":"108"}),("getPwnCd",{"areaCode":"L1100100"})]:
              q={"serviceKey":key,"dataType":"JSON","numOfRows":"10","pageNo":"1",**extra}
              try:
                  b=urllib.request.urlopen(base+op+"?"+urllib.parse.urlencode(q), timeout=30).read().decode()
              except Exception as e:
                  b="ERR "+str(e)
              print("==", op); print(b[:2500])
          PY
          curl -s "https://apihub.kma.go.kr/" -o /dev/null -w "apihub %{http_code}\n"
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
