name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
          for u in / /weather/gayasan /weather/anheung-port /weather/yongpyong /weather/bike-ipobo; do curl -s -o p.html -w "$u %{http_code} %{time_total}s " "https://tripnalc.com$u"; grep -o '<title>[^<]*' p.html; done
          curl -s https://tripnalc.com/sitemap.xml | grep -c "<loc>"
          python3 - <<'PY'
          import json, urllib.request
          for slug, lat, lon, elev in [("gayasan",35.8231,128.1180,1430),("anheung-port",36.6744,126.1294,None),("hamdeok-beach",33.5429,126.6701,None)]:
              q = f"lat={lat}&lon={lon}&v=6" + (f"&elev={elev}" if elev else "")
              f = json.load(urllib.request.urlopen(urllib.request.Request(f"https://tripnalc.com/api/forecast?{q}", headers={"User-Agent":"diag"}), timeout=60))
              d = f["days"][0]
              print(slug, f["elevation"], d["tMin"], d["tMax"], len(d.get("tides") or []))
          PY
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
