name: Collect

# ECMWF·GFS·ICON 공개 예보, GFS-Wave 파고, GEFS 강수 확률, CAMS 미세먼지, 국립해양조사원 만조·간조를 한국 영역만 R2(tripnal-data)에 올리고,
# 끝나면 저장한 여행의 날씨 변화 알림을 보내고, 예보·관측 비교용 기록(verify/)을 남긴다.
# 00·12 UTC run의 360시간 자료가 다 올라오는 시각(약 8시간 뒤)에 맞춰 돈다.
# 필요한 값: CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, KHOA_API_KEY, ADS_API_KEY (Settings > Secrets and variables > Actions)
on:
  schedule:
    - cron: "40 8 * * *"
    - cron: "40 20 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "run (YYYYMMDDHH, 비우면 최신)"
        required: false

concurrency: collect

jobs:
  ecmwf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: 받기·자르기
        run: python collector/collect.py --out out ${{ inputs.run && format('--run {0}', inputs.run) || '' }}
      - name: R2에 올리기
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python collector/upload.py out ecmwf

  gfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      # 입력한 run은 ECMWF용(00·12시)이라 GFS는 항상 최신 run을 받는다
      - name: 받기·자르기
        run: python collector/gfs.py --out out
      - name: R2에 올리기
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python collector/upload.py out gfs

  icon:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      # DWD는 최근 run만 남겨 두므로 항상 최신 run을 받는다
      - name: 받기·자르기
        run: python collector/icon.py --out out
      - name: R2에 올리기
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python collector/upload.py out icon

  wave:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: 받기·자르기
        run: python collector/gfswave.py --out out
      - name: R2에 올리기
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python collector/upload.py out wave

  gefs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: 받기·확률 계산
        run: python collector/gefs.py --out out
      - name: R2에 올리기
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python collector/upload.py out gefs

  tide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      # 이미 R2에 있는 날짜는 건너뛰고 빠진 날짜만 받는다
      - name: 받기
        run: python collector/tide.py --out out
      - name: R2에 올리기
        run: python collector/upload.py out tide

  cams:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: 받기·자르기
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: python collector/cams.py --out out
      - name: R2에 올리기
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python collector/upload.py out cams

  # 저장한 여행의 예보가 크게 바뀌었으면 웹 푸시로 알린다 (새 예보가 다 올라간 뒤)
  alerts:
    needs: [ecmwf, gfs, icon, gefs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3 pywebpush
      # 사이트가 최신 run 정보를 5분 동안 기억하므로 새 예보를 읽도록 조금 기다린다
      - run: sleep 360
      - name: 비교·발송
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python collector/alerts.py

  # 이번 주말 날씨 좋은 곳(/weekend): 장소 300여 곳 예보를 사이트에서 받아 오느라 오래 걸려 따로 돈다
  weekend:
    needs: [ecmwf, gfs, icon, gefs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      # 사이트가 최신 run 정보를 5분 동안 기억하므로 새 예보를 읽도록 조금 기다린다
      - run: sleep 360
      - name: 주말 예보 모으기
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python collector/weekend.py

  # 예보 정확도 보정용 기록: 관측소 위치의 모델별·사이트 예보와 관측값 (화면에는 안 씀)
  verify:
    needs: [ecmwf, gfs, icon, gefs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - run: sleep 360
      - name: 예보 기록
        run: python collector/verify.py forecast
      - name: 관측값 기록 (기상청 종관관측)
        if: always()
        env:
          KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
        run: python collector/verify.py obs
