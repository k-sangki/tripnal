name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          for q in "lat=37.82&lon=127.52" "lat=38.12&lon=128.47&elev=1708" "lat=33.5&lon=126.53"; do
            echo "== $q"
            curl -s "https://tripnalc.com/api/forecast?$q&provider=collected&v=x1" -o c.json -w "%{http_code} %{time_total}s\n"
            curl -s "https://tripnalc.com/api/forecast?$q&v=x1" -o o.json
            python3 -c "
          import json
          c=json.load(open('c.json')); o=json.load(open('o.json'))
          print('src', c.get('source'), c.get('elevation'), '|', o.get('source'), o.get('elevation'), c.get('error'))
          for dc, do in list(zip(c['days'], o['days']))[:16:3]:
              print(dc['date'], 'T', dc['tMin'], dc['tMax'], 'vs', do['tMin'], do['tMax'], 'P', round(dc['precipSum'],1), 'vs', round(do['precipSum'],1), 'G', dc['gustMax'], 'vs', do['gustMax'], 'code', dc['code'], do['code'])
          "
          done > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
