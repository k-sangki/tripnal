name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
          pip install -q boto3 pywebpush
          curl -s https://tripnalc.com/api/alerts; echo
          ID=$(curl -s -X POST https://tripnalc.com/api/alerts -H 'Content-Type: application/json' -d '{"subscription":{"endpoint":"https://example.com/push/test","keys":{"p256dh":"BFake","auth":"fake"}},"place":{"name":"테스트","lat":37.81,"lon":127.52},"act":"camping","from":"2026-10-24","to":"2026-10-25"}' | tee /dev/stderr | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          echo id $ID
          python3 - <<'PY'
          import boto3,os,json
          s3=boto3.client("s3",endpoint_url=f"https://{os.environ['CLOUDFLARE_ACCOUNT_ID']}.r2.cloudflarestorage.com",aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto")
          for o in s3.list_objects_v2(Bucket="tripnal-data",Prefix="alerts")["Contents"]:
              print(o["Key"], o["Size"])
          PY
          python3 collector/alerts.py --dry-run
          curl -s -X DELETE "https://tripnalc.com/api/alerts?id=$ID"; echo
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
