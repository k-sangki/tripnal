name: diag
on: { push: { branches: [claude/project-thread-i8evdz] } }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          o=diag-out.txt
          for u in / /weather/unaksan /weather/oido /weather/seoul /weather/nami-island /guide /overseas/osaka /golf "/weather/gongjaksan?from=2026-10-24&to=2026-10-25" "/weather/seoul?act=camping&vd=good" /ja /ja/weather/seoul /zh/weather/jeju /en/weather/seoul /weather/seoul/11; do
            curl -s -o b.html -D h.txt -A "$UA" -H "Accept-Language: en-US,en;q=0.9" "https://tripnalc.com$u"
            st=$(head -1 h.txt | tr -d '\r'); loc=$(grep -i '^location' h.txt | tr -d '\r')
            can=$(grep -o '<link rel="canonical" href="[^"]*"' b.html | head -1 | sed 's/.*href=//')
            rob=$(grep -o '<meta name="robots" content="[^"]*"' b.html | head -1 | sed 's/.*content=//')
            hl=$(grep -o '<link rel="alternate" hrefLang="[^"]*" href="[^"]*"' b.html | sed 's/<link rel="alternate" //' | tr '\n' ' ')
            ttl=$(grep -o '<title>[^<]*' b.html | head -1 | cut -c8-60)
            echo "$u | $st $loc | canon=$can | robots=${rob:--} | title=$ttl | $hl" >> $o
          done
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add $o; git commit -m "diag output"; git push
