name: diag
on: { push: { branches: [claude/project-thread-i8evdz] } }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          o=diag-out.txt; rm -f $o
          python3 - <<'PY' >> $o
          import random, time, urllib.request, concurrent.futures as cf, collections
          def one(i):
              lat = round(random.uniform(35.0, 37.8), 2); lon = round(random.uniform(126.8, 129.0), 2)
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(f"https://tripnalc.com/api/forecast?lat={lat}&lon={lon}&z={random.random()}", headers={"User-Agent": "tripnalc-loadtest"}), timeout=60) as r:
                      r.read(); return r.status, time.time() - t
              except urllib.error.HTTPError as e: return e.code, time.time() - t
              except Exception as e: return type(e).__name__, time.time() - t
          for conc in (1, 4, 8):
              with cf.ThreadPoolExecutor(conc) as ex: res = list(ex.map(one, range(conc * 6)))
              c = collections.Counter(s for s, _ in res); ts = sorted(t for _, t in res)
              print(f"conc {conc}: {dict(c)} median {ts[len(ts)//2]:.2f}s max {ts[-1]:.2f}s", flush=True)
          PY
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add $o; git commit -m "diag output"; git push
