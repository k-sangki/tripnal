name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            for u in /overseas/osaka /overseas/paris /overseas/bangkok /overseas/osaka /overseas/sapporo; do
              echo "$u $(curl -s -o /tmp/p.html -w '%{http_code} %{time_total}' https://tripnalc.com$u)"
              grep -o '서유럽\|동유럽\|월별 날씨</h2>' /tmp/p.html | sort | uniq -c
            done
            curl -s https://tripnalc.com/overseas | grep -o '<h2 class="card-title">[^<]*' | sed 's/.*>//' | tr '\n' ' '
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
