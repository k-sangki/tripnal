name: diag
on: { push: { branches: [claude/project-thread-i8evdz] } }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          o=diag-out.txt
          echo "== robots.txt" >> $o; curl -s -A "$UA" https://tripnalc.com/robots.txt | head -30 >> $o
          for s in sitemap.xml sitemap-removed.xml; do echo "== $s" >> $o; curl -s -o x.xml -w "%{http_code} %{size_download}\n" -A "$UA" https://tripnalc.com/$s >> $o; grep -o "<loc>" x.xml | wc -l >> $o; done
          curl -s -A "$UA" https://tripnalc.com/sitemap.xml | grep -o "<loc>[^<]*</loc>" | sed 's#<loc>##;s#</loc>##' | shuf -n 60 --random-source=<(yes) > urls.txt
          for u in https://tripnalc.com/ https://tripnalc.com/weather/unaksan https://tripnalc.com/weather/oido https://tripnalc.com/guide $(cat urls.txt); do
            code=$(curl -s -o b.html -w "%{http_code} %{time_total}" -A "$UA" "$u")
            r=$(grep -o '<meta name="robots"[^>]*>' b.html | head -1); c=$(grep -o '<link rel="canonical"[^>]*>' b.html | head -1)
            echo "$code $u ${r:-no-robots} $c" >> $o
          done
          echo "== http->https, tripnal.com" >> $o
          for u in http://tripnalc.com/ https://tripnal.com/ https://www.tripnalc.com/; do curl -s -o /dev/null -w "%{http_code} %{redirect_url} $u\n" -A "$UA" $u >> $o; done
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add $o; git commit -m "diag output"; git push
