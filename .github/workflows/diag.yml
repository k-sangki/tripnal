name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            pip install -q fonttools brotli
            curl -s "https://data.jsdelivr.com/v1/packages/gh/orioncactus/pretendard@v1.3.9?structure=flat" | python -c "import json,sys;[print(f['name']) for f in json.load(sys.stdin)['files'] if 'ExtraBold' in f['name'] or 'Variable.woff2' in f['name'] or 'Variable.ttf' in f['name']]" | head -20
            curl -sSfL -o /tmp/v.woff2 https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2 && echo got-var
            fonttools varLib.instancer /tmp/v.woff2 wght=800 -o /tmp/p.font && echo inst-ok
            python glyphs.py
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
