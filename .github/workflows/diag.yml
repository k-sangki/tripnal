name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
          curl -s -o p.out -w "baekdusan %{http_code} " "https://tripnalc.com/api/forecast?lat=42.006&lon=128.056&v=6"; head -c 160 p.out; echo
          curl -s -o p.out -w "iceland %{http_code} " "https://tripnalc.com/api/forecast?lat=64.1466&lon=-21.9426&v=6"; head -c 160 p.out; echo
          curl -s -o p.out -w "cusco %{http_code} " "https://tripnalc.com/api/forecast?lat=-13.532&lon=-71.9675&v=6"; head -c 160 p.out; echo
          curl -s -o p.out -w "yellowknife %{http_code} " "https://tripnalc.com/api/forecast?lat=62.454&lon=-114.3718&v=6"; head -c 160 p.out; echo
          curl -s -o p.out -w "manado %{http_code} " "https://tripnalc.com/api/forecast?lat=1.4748&lon=124.8421&v=6"; head -c 160 p.out; echo
          curl -s -o p.out -w "addis-ababa %{http_code} " "https://tripnalc.com/api/forecast?lat=8.9806&lon=38.7578&v=6"; head -c 160 p.out; echo
          curl -s -o p.out -w "sapa %{http_code} " "https://tripnalc.com/api/forecast?lat=22.3364&lon=103.8438&v=6"; head -c 160 p.out; echo
          curl -s -o p.out -w "tsushima %{http_code} " "https://tripnalc.com/api/forecast?lat=34.203&lon=129.288&v=6"; head -c 160 p.out; echo
          curl -s -o p.out -w "tokyo %{http_code} " "https://tripnalc.com/api/forecast?lat=35.6812&lon=139.7671&v=6"; head -c 160 p.out; echo
          curl -s -o p.out -w "dolomites %{http_code} " "https://tripnalc.com/api/forecast?lat=46.5405&lon=12.1357&v=6"; head -c 160 p.out; echo
          curl -s -o p.out -w "list %{http_code} " https://tripnalc.com/overseas; grep -o 'ov-card' p.out | wc -l
          curl -s -o /dev/null -w "page %{http_code}\n" https://tripnalc.com/overseas/baekdusan
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
