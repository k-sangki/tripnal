name: diag
on: { push: { branches: [claude/project-thread-i8evdz] } }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          for u in /weather/seoul/11 /weather/busan/3 /overseas/tokyo/11 /overseas/tokyo/forecast /en /en/weather/seoul/11 /ja; do
            for ua in "$UA" "Mozilla/5.0 Chrome/120"; do
              echo "== $u [${ua:0:20}]" >> diag-out.txt
              curl -s -D h.txt -A "$ua" "https://tripnalc.com$u?diag=$RANDOM" -o b.html
              grep -i "^HTTP\|x-robots\|cf-cache\|x-edge" h.txt >> diag-out.txt
              grep -o '<meta name="robots"[^>]*>' b.html >> diag-out.txt || echo "NO robots meta" >> diag-out.txt
              grep -bo '<meta name="robots"' b.html | head -1 >> diag-out.txt; grep -bo '</head>' b.html | head -1 >> diag-out.txt
              curl -s -D h2.txt -A "$ua" "https://tripnalc.com$u" -o b2.html
              grep -o '<meta name="robots"[^>]*>' b2.html >> diag-out.txt || echo "NO robots meta (no query)" >> diag-out.txt
            done
          done
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add diag-out.txt; git commit -m "diag output"; git push
