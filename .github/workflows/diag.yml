name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            curl -s https://tripnalc.com/ > /tmp/h.html
            grep -o 'gtag/js?id=[A-Z0-9-]*\|gtag("config","[^"]*")\|ov-banner\|apple-icon[^"]*\|icon.svg[^"]*' /tmp/h.html | sort -u
            curl -s https://tripnalc.com/manifest.webmanifest | head -c 600; echo
            for f in /icon-v2-192.png /icon-v2-512.png /icon-v2-maskable-512.png /icon-192.png; do echo "$f $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://tripnalc.com$f)"; done
            curl -s https://tripnalc.com/overseas | grep -c 'ov-banner'
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
