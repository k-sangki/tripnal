name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
          mkdir -p osm
          q() { curl -s --retry 3 -m 300 -A "tripnalc-diag" --data-urlencode "data=$2" https://overpass-api.de/api/interpreter -o osm/$1.json; echo "$1 $(wc -c < osm/$1.json)"; }
          B="33.0,124.5,38.7,131.0"
          q beach "[out:json][timeout:240];nwr[name~\"해수욕장|해변\"]($B);out center;"
          q ski "[out:json][timeout:240];(nwr[landuse=winter_sports][name]($B);nwr[name~\"스키\"][leisure=sports_centre]($B);nwr[name~\"리조트|스키장\"][sport=skiing]($B););out center;"
          git add osm
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
