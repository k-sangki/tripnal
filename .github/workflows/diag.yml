name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          for q in "lat=36.33&lon=126.6" "lat=33.5&lon=126.53" "lat=37.57&lon=126.98"; do
            echo "== $q"
            curl -s "https://tripnalc.com/api/forecast?$q&provider=collected&v=x2" -o c.json -w "%{http_code} %{time_total}s\n"
            curl -s "https://tripnalc.com/api/forecast?$q&v=x2" -o o.json
            python3 -c "
          import json
          c=json.load(open('c.json')); o=json.load(open('o.json'))
          for dc, do in list(zip(c['days'], o['days']))[:16:2]:
              sc=[s for s in dc['slots']]; so=[s for s in do['slots']]
              print(dc['date'], 'prob', [s['precipProb'] for s in sc], 'vs', [s['precipProb'] for s in so])
              print('     wave', [s['wave'] for s in sc], 'vs', [s['wave'] for s in so])
          "
          done > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
