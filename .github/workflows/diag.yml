name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            python3 - <<'PY'
          import sys, json; sys.path.insert(0, "collector")
          from upload import client
          s3 = client()
          print(s3.get_object(Bucket="tripnal-data", Key="weekend/latest.json")["Body"].read().decode())
          PY
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
