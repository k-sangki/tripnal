name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
          curl -s https://tripnalc.com/ > /tmp/h
          grep -o '<meta name="naver-site-verification"[^>]*>' /tmp/h
          grep -o 'cloudflareinsights[^;]*' /tmp/h | head -c 300; echo
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
