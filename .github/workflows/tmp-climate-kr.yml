name: tmp climate kr
# 임시: 이 컨테이너에서 NASA POWER에 접속할 수 없어 Actions에서 한 번 돌리고 로그로 결과를 받는다. 결과를 받으면 지운다.
on:
  push:
    branches: [claude/project-thread-ayk3pv]
    paths: [.github/workflows/tmp-climate-kr.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector/climate.py --korea
        env:
          KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
