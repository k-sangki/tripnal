name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
          F='%{http_code} dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}'
          for q in 자라섬 가평 서울숲 설악산 대천 을왕리 남이섬 강릉 제주 부산; do curl -s -o p.out -D h.out -w "search $q $F\n" "https://tripnalc.com/api/search?q=$q"; grep -i '^cf-ray' h.out; head -c 120 p.out; echo; done
          for k in 1 2 3 4 5; do curl -s -o /dev/null -w "search-same $F\n" "https://tripnalc.com/api/search?q=%EA%B0%80%ED%8F%89"; done
          for k in 1 2 3; do curl -s -o /dev/null -w "reverse $F\n" "https://tripnalc.com/api/reverse?lat=37.5&lon=127.0"; done
          for k in 1 2 3; do curl -s -o /dev/null -w "robots $F\n" "https://tripnalc.com/robots.txt"; done
          for k in 1 2 3; do curl -s -o /dev/null -w "home $F\n" "https://tripnalc.com/"; done
          for k in 1 2 3; do curl -s -o /dev/null -w "warnings $F\n" "https://tripnalc.com/api/warnings"; done
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
