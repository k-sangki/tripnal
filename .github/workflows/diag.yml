name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
          curl -s -o og.png -w "og %{http_code} %{content_type} %{size_download} %{time_total}\n" -A "facebookexternalhit/1.1" "https://tripnalc.com/api/og?lat=37.5665&lon=126.978&name=%EC%84%9C%EC%9A%B8&act=camping&from=2026-10-24&to=2026-10-26"
          curl -s -o /dev/null -w "og-slug %{http_code} %{size_download} %{time_total}\n" "https://tripnalc.com/api/og?slug=jarasum-autocamp"
          curl -s -A "kakaotalk-scrap/1.0" "https://tripnalc.com/?lat=37.5665&lon=126.978&name=%EC%84%9C%EC%9A%B8&act=camping&from=2026-10-24&to=2026-10-26" | grep -oE '<meta property="og:(title|description|image)"[^>]*>'
          base64 -w0 og.png > og.b64; echo; echo b64 $(wc -c < og.b64)
          cat og.b64
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
