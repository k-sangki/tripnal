name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            for u in /weekend /overseas/tokyo /overseas /weather /overseas/month/10 /overseas/tokyo/10; do
              f=$(echo $u | tr / _).html
              echo "$u $(curl -s -o $f -w '%{http_code} %{time_total} %{size_download}' "https://tripnalc.com$u")"
            done
            grep -c 'wk-rank' _weekend.html; grep -o '주말 [^<]* 가기 좋은 곳' _weekend.html; grep -o '정리하는 중' _weekend.html
            grep -o 'city-info.\{0,300\}' _overseas_tokyo.html | sed 's/<[^>]*>/ /g' | head -c 500; echo
            grep -o '이번 주말 날씨 좋은 곳' _weather.html | head -1
            grep -o '10월에 가기 좋은 다른 여행지' _overseas_tokyo_10.html | head -1
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
