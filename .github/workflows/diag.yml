name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
            git fetch -q origin main && git checkout origin/main -- collector src/lib/places.ts
            pip install -q boto3
            python collector/weekend.py
            curl -s https://tripnalc.com/weekend -o w.html; grep -c 'wk-rank' w.html; grep -o '주말 [^<]* 가기 좋은 곳' w.html
            curl -s https://tripnalc.com/overseas/tokyo -o t.html; grep -o 'city-info.\{0,400\}' t.html | head -c 600; echo
            curl -s https://tripnalc.com/overseas -o o.html; grep -o '[0-9]*월에 가기 좋은 해외 여행지' o.html | head -2
            curl -s https://tripnalc.com/weather -o x.html; grep -o '이번 주말 날씨 좋은 곳' x.html | head -1
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
