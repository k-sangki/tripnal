name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
          sleep 60
          for u in https://tripnal.com/ https://www.tripnal.com/weather/jarasum-autocamp https://tripnalc.com/ https://www.tripnalc.com/about https://tripnalc.com/ads.txt https://tripnalc.com/manifest.webmanifest; do echo "== $u"; curl -s -o /tmp/b -w "%{http_code} -> %{redirect_url}\n" "$u"; head -c 150 /tmp/b | tr '\n' ' '; echo; done
          curl -s https://tripnalc.com/ | grep -o '<title>[^<]*</title>'
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
