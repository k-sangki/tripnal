name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
          F='%{http_code} ttfb=%{time_starttransfer} total=%{time_total}'
          for q in %EC%9E%90%EB%9D%BC%EC%84%AC %EA%B0%80%ED%8F%89 %EC%84%A4%EC%95%85%EC%82%B0 %EB%8C%80%EC%B2%9C %EC%A0%9C%EC%A3%BC %EB%B6%80%EC%82%B0 %EA%B0%80%ED%8F%89 %EA%B0%80%ED%8F%89; do curl -s -o p.out -D h.out -w "search $F " "https://tripnalc.com/api/search?q=$q"; grep -i '^server-timing\|^cf-ray' h.out | tr -d '\r' | tr '\n' ' '; echo; done
          for k in 1 2 3; do curl -s -o /dev/null -w "robots $F\n" "https://tripnalc.com/robots.txt?k=$k"; done
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
