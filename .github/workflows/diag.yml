name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set +e
          {
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          seeds = ["날씨","주말 날씨","이번주 날씨","캠핑 날씨","캠핑장 날씨","낚시 날씨","바다 날씨","물때","물때표","등산 날씨","산 날씨","여행 날씨","제주 날씨","강원도 날씨","10일 날씨","15일 날씨","16일 날씨","한달 날씨","장기 날씨","주간 날씨","캠핑","백패킹 날씨","라이딩 날씨","자전거 날씨","골프 날씨","스키장 날씨","해수욕장 날씨","바람","풍속","파고","트립날씨","여행날씨","캠핑날씨","이번주날씨"]
          out = {}
          for q in seeds:
              r = {}
              try:
                  u = "https://ac.search.naver.com/nx/ac?" + urllib.parse.urlencode({"q": q, "con": 1, "frm": "nv", "ans": 2, "r_format": "json", "r_enc": "UTF-8", "r_unicode": 0, "t_koreng": 1, "run": 2, "rev": 4, "q_enc": "UTF-8", "st": 100})
                  j = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20))
                  r["naver"] = [i[0] for i in j["items"][0]]
              except Exception as e:
                  r["naver"] = str(e)
              try:
                  u = "https://suggestqueries.google.com/complete/search?" + urllib.parse.urlencode({"client": "firefox", "hl": "ko", "gl": "kr", "q": q})
                  r["google"] = json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode("utf-8", "replace"))[1]
              except Exception as e:
                  r["google"] = str(e)
              out[q] = r
              time.sleep(0.3)
          print(json.dumps(out, ensure_ascii=False, indent=1))
          PY
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
