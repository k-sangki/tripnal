name: diag
on:
  push:
    branches: [claude/diag-1026]
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
      ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
          curl -s -m 30 "https://www.data.go.kr/data/15156018/openapi.do" -o page.html
          grep -o 'apis\.data\.go\.kr[^"<> ]*' page.html | sort -u | head
          grep -oiE '(swagger|oas)[^"<> ]{0,150}' page.html | sort -u | head
          grep -oE 'publicDataDetailPk[^,]{0,60}|uddi:[0-9a-f-]+' page.html | sort -u | head
          grep -oE '<a [^>]*hwp[^>]*>' page.html | head -3
          grep -oE 'fn_fileDownload\([^)]*\)|fileDetailSn[^,]{0,40}|atchFileId[^,]{0,60}' page.html | sort -u | head
          } > diag-out.txt 2>&1
          git config user.name diag; git config user.email diag@example.com
          git add -A diag-out.txt; git commit -m 'diag out'; git push -f origin HEAD:claude/diag-1026
